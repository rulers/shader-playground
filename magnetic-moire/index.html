<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#e9e7df" />
    <meta name="description" content="指先に引かれ、重なりが模様へ変わる。" />
    <title>磁力のモアレ — Shader Playground</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="light">
    <canvas
      id="view"
      tabindex="0"
      aria-label="指先に引かれ、重なりが模様へ変わる。。キーボードの矢印とスペースキーでも操作できます。"
    ></canvas>
    <header>
      <a href="../">↖ SHADER PLAYGROUND</a
      ><span>EXPERIMENT 14 / FRI · NOV 06</span>
    </header>
    <main>
      <div class="intro">
        <p class="eyebrow">A STUDY OF INTERFERENCE & ATTRACTION</p>
        <h1>磁力のモアレ<span>MAGNETIC MOIRÉ</span></h1>
        <p class="description">指先に引かれ、重なりが模様へ変わる。</p>
      </div>
      <div class="dock">
        <button
          id="toggle"
          type="button"
          aria-label="調整UIを開く"
          aria-expanded="false"
          aria-controls="controls"
        >
          ＋
        </button>
        <section id="controls" aria-label="作品の調整" hidden>
          <div class="heading">
            調整<button id="close" type="button" aria-label="調整UIを閉じる">
              ×
            </button>
          </div>
          <label for="amount"
            >引き寄せる強さ<output id="amount-value">0.8</output
            ><input
              id="amount"
              type="range"
              min="0.2"
              max="1.5"
              step="0.1"
              value="0.8"
          /></label>
          <div class="buttons">
            <button id="pause" type="button" aria-pressed="false">
              一時停止</button
            ><button id="reset" type="button">最初から</button>
          </div>
          <p>
            矢印キーで位置を移動、スペースで作用。Escapeで調整を閉じます。モーション低減設定時は停止して開きます。
          </p>
        </section>
      </div>
    </main>
    <footer>
      <span>PROCEDURAL / CANVAS 2D</span
      ><span id="status" role="status">作品を準備中…</span>
    </footer>
  </body>
</html>
