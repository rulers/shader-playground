<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>水のあわい — Shader Playground</title>
<meta name="description" content="光へ浮かび、深みへ泳ぐ錦鯉。気ままな三次元の軌跡が、水面に波紋を残す。">
<link rel="stylesheet" href="style.css?v=koi-water-1"><link rel="stylesheet" href="water.css"><script src="app3d.js?v=koi-water-1" type="module"></script>
</head>
<body>
<canvas id="view" aria-label="錦鯉が上下・前後・左右に泳ぎ、水面に近づくと波紋が広がる立体アニメーション"></canvas>
<header><a href="../">↖ SHADER PLAYGROUND</a><span>EXPERIMENT 05</span></header>
<main><div class="intro"><p class="eyebrow">A STUDY OF DEPTH & STILLNESS</p><h1>水のあわい<span>BETWEEN DEPTH AND LIGHT</span></h1><p class="description">光へ浮かび、深みへ泳ぐ。<br>気ままな軌跡が、水面に輪を残す。</p></div>
<div class="dock"><button id="toggle" aria-label="調整UIを開く" aria-expanded="false" aria-controls="controls">＋</button>
<section id="controls" aria-label="作品の調整" hidden><div class="heading">調整<button id="close" aria-label="調整UIを閉じる">×</button></div>
<label for="speed">泳ぐ速さ<output id="speed-value">0.7</output><input id="speed" type="range" min="0" max="1.5" step=".05" value=".7"></label>
<label for="bend">体のくねり<output id="bend-value">1.2</output><input id="bend" type="range" min=".3" max="2" step=".05" value="1.2"></label>
<label for="paper">水底の質感<output id="paper-value">1.0</output><input id="paper" type="range" min="0" max="1.8" step=".05" value="1"></label>
<label for="count">鯉の数<output id="count-value">5</output><input id="count" type="range" min="1" max="7" step="1" value="5"></label>
<div class="buttons"><button id="pause" aria-pressed="false">一時停止</button><button id="reset">最初から</button></div>
<p>手続き的な描画による試作 · 絵や動画素材は使用していません。</p></section></div></main>
<footer><span>A GENERATIVE POND / WEBGL 2</span><span id="status" role="status">水中の景色を準備中…</span></footer>
</body></html>
