name: Lightweight CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  logic-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check AI documentation
        run: python3 tools/check_ai_docs.py
      - name: Check whitespace in the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Run dependency-free logic tests
        run: >-
          node --test
          portraits/tests/*.test.js
          soseki/tests/*.test.js
          koi/tests/motion.test.mjs
          magnetic-shapes/tests/model.test.mjs
          tests/butterfly-void/*.test.mjs
