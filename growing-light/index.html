<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081a15" />
    <meta
      name="description"
      content="ひかりを探して、枝を伸ばす。 クリックで種をまき、指を動かして光を導きます。"
    />
    <title>光の植物 — Shader Playground</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <canvas
      tabindex="0"
      aria-label="クリックで種をまき、指を動かして光を導きます。 Enterキーで体験、スペースで一時停止"
      aria-describedby="hint"
      >Canvas 2Dに対応したブラウザーでご覧ください。</canvas
    >
    <header>
      <a href="../">↖ SHADER PLAYGROUND</a><span>EXPERIMENT 12</span>
    </header>
    <main>
      <div class="intro">
        <p class="eyebrow">A STUDY OF GROWTH & ATTRACTION</p>
        <h1>光の植物<span>GROWING LIGHT</span></h1>
        <p>ひかりを探して、枝を伸ばす。</p>
        <p class="description" id="hint">
          クリックで種をまき、指を動かして光を導きます。
        </p>
      </div>
      <div class="dock">
        <button
          id="toggle"
          aria-label="調整UIを開く"
          aria-expanded="false"
          aria-controls="controls"
        >
          ＋
        </button>
        <section id="controls" aria-label="作品の調整" hidden>
          <div class="heading">
            調整<button id="close" aria-label="調整UIを閉じる">×</button>
          </div>
          <label for="amount"
            >成長速度<output>1.00</output
            ><input
              id="amount"
              type="range"
              min="0.4"
              max="2"
              step="0.1"
              value="1"
          /></label>
          <div class="buttons">
            <button id="pause" aria-pressed="false">一時停止</button
            ><button id="reset">最初から</button>
          </div>
          <button id="action">種をまく</button>
          <p>
            画面にフォーカスしてEnterで体験、スペースで再生／停止。動きを減らす設定では停止して開きます。
          </p>
        </section>
      </div>
    </main>
    <footer>
      <span>PROCEDURAL ART / CANVAS 2D</span
      ><span id="status" role="status"
        >クリックで種をまき、指を動かして光を導きます。</span
      >
    </footer>
  </body>
</html>
