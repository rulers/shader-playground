<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨の庭 · Ink Playground</title>
<style>
    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        background: #eae7df;
        color: #292e2e;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif
    }

    button,
    select,
    input {
        font: inherit
    }

    button,
    select {
        border: 1px solid #cfcdc5;
        border-radius: 7px;
        background: #faf9f5;
        padding: 8px 13px;
        color: inherit;
        cursor: pointer
    }

    button:hover {
        background: #e6e2d7
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
        outline: 2px solid #246964;
        outline-offset: 3px
    }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 23px 4vw;
        border-bottom: 1px solid #d7d3c9
    }

    h1 {
        font-family: serif;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: .1em;
        margin: 0
    }

    small {
        font-size: 11px;
        letter-spacing: .16em;
        color: #7d8178
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 18px
    }

    .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap
    }

    main {
        padding: 24px 4vw 16px
    }

    .workspace {
        position: relative;
        border: 1px solid #d3d0c5;
        background: #faf9f4;
        box-shadow: 0 12px 35px #423c3110
    }

    canvas {
        display: block;
        width: 100%;
        height: min(66vh, 720px);
        min-height: 320px;
        touch-action: none;
        cursor: crosshair
    }

    .hint {
        position: absolute;
        top: 28px;
        left: 30px;
        pointer-events: none;
        color: #8b8c81;
        transition: opacity .5s
    }

    .hint strong {
        display: block;
        color: #555d54;
        font: 23px serif;
        margin-bottom: 7px
    }

    .hint.hidden {
        opacity: 0
    }

    .toolbar {
        display: flex;
        align-items: center;
        gap: 26px;
        flex-wrap: wrap;
        padding: 18px 0
    }

    .group {
        display: flex;
        align-items: center;
        gap: 10px
    }

    .label {
        font-size: 11px;
        letter-spacing: .12em;
        color: #6c7169
    }

    .colors {
        display: flex;
        gap: 7px
    }

    .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        padding: 0;
        border: 3px solid #eae7df;
        box-shadow: 0 0 0 1px transparent
    }

    .swatch[aria-pressed=true] {
        box-shadow: 0 0 0 1px #60675f
    }

    input[type=range] {
        width: 100px;
        accent-color: #475b50
    }

    output {
        min-width: 22px;
        font-size: 12px
    }

    footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #787d73;
        font-size: 12px;
        border-top: 1px solid #d6d2c8;
        padding: 13px 0
    }

    #error {
        color: #a32c29;
        white-space: pre-wrap
    }

    a {
        color: inherit
    }

    @media(max-width:650px) {
        header {
            padding: 16px 5vw;
            align-items: flex-start
        }

        .brand {
            display: block
        }

        h1 {
            font-size: 22px
        }

        .actions {
            justify-content: flex-end;
            max-width: 185px
        }

        main {
            padding: 16px 5vw
        }

        .toolbar {
            gap: 16px
        }

        canvas {
            height: 58vh
        }

        .hint {
            top: 18px;
            left: 18px
        }

        .hint strong {
            font-size: 19px
        }

        footer {
            display: block
        }
    }
</style>
<header>
    <div class="brand">
        <h1>墨の庭</h1><small>INK PLAYGROUND</small>
    </div>
    <div class="actions"><button id="example">一滴を試す</button><button id="pause">一時停止</button><button
            id="clear">白紙に戻す</button><button id="save">PNG保存</button></div>
</header>
<main>
    <div class="workspace"><canvas id="view" aria-label="インクを描くキャンバス" tabindex="0"></canvas>
        <div class="hint" id="hint"><strong>動かす。にじむ。重なる。</strong>マウス移動で描く／押して描く、を下で選べます。<br>タッチでは指でなぞってください。</div>
    </div>
    <div class="toolbar">
        <div class="group"><span class="label">INK</span>
            <div class="colors" id="colors"><button class="swatch" style="background:#191f24" data-color="#191f24"
                    aria-label="墨色" aria-pressed="true"></button><button class="swatch" style="background:#183f68"
                    data-color="#183f68" aria-label="藍色" aria-pressed="false"></button><button class="swatch"
                    style="background:#a23f40" data-color="#a23f40" aria-label="朱色"
                    aria-pressed="false"></button><button class="swatch" style="background:#48624a" data-color="#48624a"
                    aria-label="苔色" aria-pressed="false"></button><button class="swatch" style="background:#956b30"
                    data-color="#956b30" aria-label="琥珀色" aria-pressed="false"></button></div>
        </div><label class="group"><span class="label">筆の太さ</span><input id="size" type="range" min="3" max="35"
                value="15"><output id="sizeValue">15</output></label><label class="group"><span
                class="label">にじみ</span><input id="wet" type="range" min="0" max="2" step=".1" value="1.2"><output
                id="wetValue">1.2</output></label><label class="group"><span class="label">操作</span><select
                id="interaction">
                <option value="hover">マウス移動で描く</option>
                <option value="drag">押している間だけ描く</option>
            </select></label>
    </div>
    <div id="error" role="alert"></div>
    <footer><span>ゆっくり動かすと太く、速く動かすと細く。Space：停止 / C：色替え / R：白紙</span><span id="status" role="status">準備中…</span></footer>
</main>
<script src="shaders.js"></script>
<script src="app.js"></script>

</html>
